ize:clamp(11px,.78vw,15px);letter-spacing:.12em;color:#fff;margin-bottom:.55vh;font-weight:700}.tickerTag .mainline{font-size:clamp(22px,1.72vw,33px);letter-spacing:-.025em;color:#fff}.tickerViewport{overflow:hidden;flex:1;height:100%;display:flex;align-items:center;background:#f5f5f5;border-bottom:5px solid #151515}.tickerText{font-family:"Arial Narrow","Roboto Condensed","Segoe UI",Arial,sans-serif;font-size:clamp(25px,1.88vw,37px);font-weight:800;letter-spacing:-.012em;white-space:nowrap;display:inline-block;animation:scroll 105s linear infinite;padding-left:14vw;color:#101010}.newsItem{display:inline-flex;align-items:center;margin-right:10vw}.newsLabel{font-weight:900;margin-right:1vw;padding:.28em .58em;font-size:.70em;letter-spacing:.045em;text-transform:uppercase;color:#fff!important;background:#171717;border-left:6px solid #b40000}.newsLabel.politica{border-left-color:#f0c400}.newsLabel.geo{border-left-color:#1677d2}.newsLabel.esporte{border-left-color:#159447}.newsBody{color:#111;text-shadow:none}.newsItem:after{content:"";width:7px;height:7px;border-radius:50%;background:#b40000;margin-left:10vw}.newsItem:last-child:after{display:none}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}.updated{position:absolute;right:2.2vw;bottom:1.7vh;color:#666;font-size:clamp(11px,.9vw,16px);letter-spacing:.3px}@media(max-width:1100px){.top{grid-template-columns:24vw 21vw 21vw 1fr;column-gap:1.2vw}.calendarBox{width:25vw}.clockWrap{width:72vw}.clock{font-size:22vw}.rate{padding-left:1vw;padding-right:1vw}}

<div class="ticker"><div class="tickerTag"><span class="mainline">BRASIL</span></div><div class="tickerViewport"><div id="ticker" class="tickerText">Carregando notícias do Brasil...</div></div></div><div id="updated" class="updated">ATUALIZANDO...</div></main><script>
const TZ='America/Asuncion',LAT=-22.55,LON=-55.73;let holidays=[];
function nowPJC(){return new Date(new Date().toLocaleString('en-US',{timeZone:TZ}))}
function tick(){const p=new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date());document.getElementById('hh').textContent=p.find(x=>x.type==='hour').value;document.getElementById('mm').textContent=p.find(x=>x.type==='minute').value;document.getElementById('ss').textContent=p.find(x=>x.type==='second').value}tick();setInterval(tick,1000);
async function weather(){try{const u=`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m&hourly=temperature_2m&timezone=America%2FAsuncion&forecast_days=1`;const j=await(await fetch(u,{cache:'no-store'})).json();document.getElementById('temp').textContent=Math.round(j.current.temperature_2m)+'°C';const at=h=>{const i=j.hourly.time.findIndex(x=>x.endsWith('T'+String(h).padStart(2,'0')+':00'));return i>=0?Math.round(j.hourly.temperature_2m[i])+'°C':'--°C'};morning.textContent=at(9);afternoon.textContent=at(15);night.textContent=at(21)}catch(e){}}
async function rates(){
 const paint=(key,current)=>{const prev=parseFloat(localStorage.getItem(key));let cls='fx-neutral';if(Number.isFinite(prev)){if(current<prev)cls='fx-up';else if(current>prev)cls='fx-down'}localStorage.setItem(key,String(current));return cls};
 try{
  const r=await fetch('https://economia.awesomeapi.com.br/json/last/USD-BRL',{cache:'no-store'}); if(!r.ok) throw new Error();
  const j=await r.json(); if(j.USDBRL){const v=+j.USDBRL.bid,cls=paint('pjc_usdbrl_prev',v);brlusd.innerHTML='US$ 1 = <span class="'+cls+'">R$ '+new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v)+'</span>'}
 }catch(e){console.error('Erro USD-BRL:',e)}
 try{
  let v;
  try{
   const r=await fetch('https://www.currencyexchangetool.com/api/v1/convert?amount=1&from=BRL&to=PYG&_='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error();
   const j=await r.json(); v=Number(j.rate ?? j.result); if(!Number.isFinite(v)||v<=0) throw new Error();
  }catch(e){
   const r=await fetch('https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/brl.json?_='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error();
   const j=await r.json(); v=Number(j.brl&&j.brl.pyg); if(!Number.isFinite(v)||v<=0) throw new Error();
  }
  const cls=paint('pjc_brlpyg_prev',v);brlpyg.innerHTML='R$ 1 = <span class="'+cls+'">₲ '+new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(v)+'</span>';
 }catch(e){console.error('Erro BRL-PYG:',e)}
}
async function loadHolidays(){try{const y=nowPJC().getFullYear();holidays=await(await fetch(`https://brasilapi.com.br/api/feriados/v1/${y}`,{cache:'no-store'})).json()}catch(e){holidays=[]}renderCalendar()}
function renderCalendar(){const n=nowPJC(),y=n.getFullYear(),m=n.getMonth();month.textContent=n.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase();calendar.innerHTML=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'].map(x=>`<div class="head">${x}</div>`).join('');const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++)calendar.innerHTML+='<div></div>';for(let d=1;d<=days;d++)calendar.innerHTML+=`<div class="${d===n.getDate()?'today':''}">${d}</div>`;const today=`${y}-${String(m+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;const up=holidays.filter(h=>h.date>=today).slice(0,2);holidayList.innerHTML='<div class="title">PRÓXIMOS FERIADOS (BRASIL)</div>'+(up.length?up.map(h=>`<div><span class="hdate">${h.date.slice(8,10)}/${h.date.slice(5,7)}</span>${h.name}</div>`).join(''):'<div>Nenhum feriado nacional restante.</div>')}
async function news(){
 const feeds=[
  ['POLÍTICA','https://agenciabrasil.ebc.com.br/rss/politica/feed.xml'],
  ['GEOPOLÍTICA','https://agenciabrasil.ebc.com.br/rss/internacional/feed.xml'],
  ['ESPORTE','https://agenciabrasil.ebc.com.br/rss/esportes/feed.xml']
 ];
 try{
  const headlines=await Promise.all(feeds.map(async([label,feed,itemIndex=0])=>{
   const api='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(feed);
   const r=await fetch(api,{cache:'no-store'}); if(!r.ok) throw 0;
   const j=await r.json(); const item=(j.items||[])[itemIndex];
   if(!item) throw 0; return [label,item.title];
  }));
  const cls={"POLÍTICA":"politica","GEOPOLÍTICA":"geo","ESPORTE":"esporte","INTERNACIONAL":"internacional"};
  ticker.innerHTML=headlines.map(([label,title])=>`<span class="newsItem"><span class="newsLabel ${cls[label]}">${label}:</span><span class="newsBody">${title}</span></span>`).join('')+`<span class="newsItem"><span class="newsBody">Fonte: Agência Brasil</span></span>`;
 }catch(e){ticker.innerHTML='<span class="newsItem"><span class="newsLabel politica">POLÍTICA</span></span><span class="newsItem"><span class="newsLabel geo">GEOPOLÍTICA</span></span><span class="newsItem"><span class="newsLabel esporte">ESPORTE</span> — notícias temporariamente indisponíveis</span>'}
}
async function update(){await Promise.all([weather(),rates(),loadHolidays(),news()]);updated.textContent='ATUALIZADO EM '+new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(',','')}update();setInterval(()=>Promise.all([weather(),rates(),loadHolidays()]).then(()=>{updated.textContent='ATUALIZADO EM '+new Intl.DateTimeFormat('pt-BR',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(',','')}),15*60*1000);setInterval(news,5*60*1000);setInterval(renderCalendar,60*1000);
</script>

<script id="mobile-safe-scale-script">
(function () {
  function fitDashboard() {
    if (window.innerWidth > 900) {
      document.body.style.transform = '';
      document.body.style.width = '';
      document.body.style.height = '';
      return;
    }

    /* The original dashboard was designed around a 1920x1080 canvas.
       Scale the complete canvas so absolute-positioned elements stay visible. */
    var designW = 1920;
    var designH = 1080;
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var scale = Math.min(vw / designW, vh / designH);

    document.body.style.width = designW + 'px';
    document.body.style.height = designH + 'px';
    document.body.style.transformOrigin = 'top left';
    document.body.style.transform = 'scale(' + scale + ')';
  }

  window.addEventListener('load', fitDashboard);
  window.addEventListener('resize', fitDashboard);
  window.addEventListener('orientationchange', function () {
    setTimeout(fitDashboard, 150);
  });
})();
</script>
